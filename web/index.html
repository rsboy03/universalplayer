<html lang="en">
<head>
<meta charset="utf-8">
<title>Universal Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- One shape: a pill at the top of the screen while music plays, grown into the full card by /upl. -->
  <div id="cap" class="cap" data-mode="hidden" aria-label="Universal Player">
    <div class="shape" aria-hidden="true"></div>

    <!-- the pill (what is playing, always the same place) -->
    <div class="pill" id="pill">
      <div class="pill-art" id="pillArt"></div>
      <div class="pill-text"><span id="pillTitle" class="pill-title"></span></div>
      <div class="pill-level" id="pillLevel" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="pill-line"><i id="pillLine"></i></div>
    </div>

    <!-- the card: .card is clipped with the shape; .card-in is its content, whose height the shape follows -->
    <div class="card" id="card">
      <div class="card-in" id="cardIn">
        <div id="risk" class="risk" hidden>
          <p class="risk-head">Before you press play</p>
          <p>Universal Player is free, with no support. You and this server use it, and every link you
            play, at your own risk. Only play music you are allowed to play.</p>
          <div class="risk-row"><button id="accept" class="btn dark">I understand</button><button class="btn ghost js-close">Not now</button></div>
        </div>

        <div id="main">
          <header class="now">
            <div class="art" id="art"></div>
            <div class="now-text">
              <div class="title" id="title">Nothing playing</div>
              <div class="artist" id="artist">Paste a link below to start</div>
            </div>
            <button class="round js-close" aria-label="Close" title="Close">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </header>

          <div class="prog off" id="prog">
            <span id="tNow" class="time">0:00</span>
            <div class="track" id="track" role="slider" tabindex="-1" aria-label="Position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
              <div class="rail"><i id="fill"></i></div>
              <div class="knob-run" id="knobRun"><b class="knob"></b></div>
            </div>
            <span id="tEnd" class="time end">0:00</span>
          </div>

          <div class="ctl">
            <button id="save" class="round" aria-label="Save this song" title="Save">
              <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
            </button>
            <button id="pause" class="big" aria-label="Pause">
              <svg class="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
              <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>
            </button>
            <button id="next" class="round" aria-label="Next song" title="Next song" hidden>
              <svg viewBox="0 0 24 24"><path d="M7 6.5v11l8-5.5z"/><path d="M17.5 6.5v11"/></svg>
            </button>
            <button id="stop" class="round" aria-label="Stop" title="Stop">
              <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
            </button>
            <label class="vol" title="Volume">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/></svg>
              <input id="volume" type="range" min="0" max="100" value="60" aria-label="Volume">
            </label>
          </div>

          <div class="where-row" id="whereRow">
            <span class="label" id="whereLabel">Plays on</span>
            <div class="where" id="where" role="radiogroup" aria-labelledby="whereLabel"></div>
          </div>

          <!-- Spotify: this player's own account (only when the server has Spotify switched on) -->
          <div class="spot" id="spot" hidden>
            <i class="spot-dot" aria-hidden="true"></i>
            <p class="spot-text" id="spotText" role="status"></p>
            <button class="btn small" id="spotBtn" type="button" hidden></button>
          </div>

          <form id="slot" class="slot" autocomplete="off">
            <input id="link" type="text" spellcheck="false" placeholder="Paste a YouTube, mp3 or radio link" aria-label="Link" aria-describedby="msg">
            <button id="play" class="btn dark" type="submit"><span class="btn-text">Play</span><i class="spinner" aria-hidden="true"></i></button>
          </form>
          <p id="msg" class="msg" role="status" aria-live="polite"></p>

          <nav class="tabs" role="tablist">
            <button class="tab on" data-tab="saved" role="tab" aria-selected="true">Saved<span id="nSaved"></span></button>
            <button class="tab" data-tab="recent" role="tab" aria-selected="false">Recent</button>
          </nav>
          <ul id="list" class="list"></ul>
        </div>
      </div>
    </div>
  </div>

  <div id="players" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
